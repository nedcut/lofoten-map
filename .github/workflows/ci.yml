name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/media-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The same script the pre-push hook runs: lint (type-aware, no warnings),
      # typecheck, and unit tests with the coverage floor from vitest.config.ts.
      - name: Lint, typecheck, and unit tests
        run: npm run ci

      - name: Build
        run: npm run build
        env:
          # The app degrades to demo mode when these are absent, so the build
          # is exercised without needing real secrets in CI.
          NEXT_PUBLIC_TRIP_SLUG: lofoten-2026

      - name: Typecheck and test Cloudflare media worker
        run: |
          npm ci --prefix cloudflare/media-worker
          npm run verify:worker

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts its own demo-mode production builds via its
      # webServer block: one without a Mapbox token on :3100 for the shell and
      # data flows, and one with a token on :3101 for the real-map project.
      # The map project only runs when the E2E_MAPBOX_TOKEN secret is set, and
      # secrets are withheld from fork and Dependabot PRs, so those runs cover
      # the mapless projects only (the config logs that it skipped the map).
      - name: Run Playwright suite
        run: npm run test:e2e
        env:
          E2E_MAPBOX_TOKEN: ${{ secrets.E2E_MAPBOX_TOKEN }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # The CI reporter is "github" (annotations only), so the useful
          # failure output is the traces and screenshots in test-results/.
          name: playwright-test-results
          path: test-results/
          retention-days: 7
